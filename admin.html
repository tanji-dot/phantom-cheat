<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>PHANTOM · Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0a0a0f; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { max-width: 800px; width: 100%; padding: 2rem; background: rgba(20,20,30,0.9); border-radius: 2rem; border: 1px solid #2a2a3a; box-shadow: 0 0 60px rgba(100,0,255,0.15); }
        h1 { font-size: 3rem; font-weight: 800; background: linear-gradient(135deg, #a855f7, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
        .card { background: #14141c; padding: 1.5rem; border-radius: 1.5rem; margin: 1.5rem 0; border-left: 4px solid #a855f7; }
        select, button { width: 100%; padding: 0.8rem; margin: 0.5rem 0; border-radius: 1rem; border: 1px solid #333; background: #1e1e2a; color: white; font-size: 1rem; }
        .btn { background: linear-gradient(135deg, #a855f7, #6366f1); cursor: pointer; font-weight: bold; border: none; }
        .btn:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(168,85,247,0.3); }
        .key-box { background: #0a0a12; padding: 1rem; border-radius: 1rem; font-family: monospace; font-size: 0.9rem; word-break: break-all; border: 1px dashed #6366f1; margin: 0.5rem 0; max-height: 400px; overflow-y: auto; }
        .key-entry { padding: 0.3rem 0; border-bottom: 1px solid #1e1e2a; }
        .used { color: #f87171; }
        .free { color: #4ade80; }
        footer { text-align: center; margin-top: 2rem; color: #555566; font-size: 0.8rem; }
    </style>
</head>
<body>
<div class="container">
    <h1>👑 PHANTOM · Admin</h1>
    <p style="text-align:center; color:#8888aa;">Generiere Lizenzkeys für deine User</p>

    <div class="card">
        <h2>🔑 Key-Generator</h2>
        <label>Laufzeit wählen:</label>
        <select id="duration">
            <option value="1day">1 Tag</option>
            <option value="3days">3 Tage</option>
            <option value="1month">1 Monat</option>
            <option value="lifetime">⚡ Lifetime</option>
        </select>
        <button class="btn" onclick="generateAdminKey()">⚡ Key generieren</button>
    </div>

    <div class="card">
        <h2>📋 Alle generierten Keys</h2>
        <div id="keyList" class="key-box">🔄 Lade Keys...</div>
    </div>

    <footer>
        PHANTOM · nur für Bildungszwecke · 2026
    </footer>
</div>

<script>
    // ⚠️ HIER DEINE SUPABASE-DATEN EINTRAGEN!
    const SUPABASE_URL = 'https://phantom-backend-917k.onrender.com';

    async function generateAdminKey() {
        const duration = document.getElementById('duration').value;
        const expiresAt = new Date();
        if (duration === '1day') expiresAt.setDate(expiresAt.getDate() + 1);
        else if (duration === '3days') expiresAt.setDate(expiresAt.getDate() + 3);
        else if (duration === '1month') expiresAt.setMonth(expiresAt.getMonth() + 1);
        else if (duration === 'lifetime') expiresAt.setFullYear(expiresAt.getFullYear() + 100);

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let key = 'PHANTOM-';
        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 4; j++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            if (i < 2) key += '-';
        }
        key += `|${expiresAt.toISOString().slice(0,10)}`;

        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/keys`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                },
                body: JSON.stringify({
                    key_value: key,
                    duration: duration,
                    expires_at: expiresAt.toISOString()
                })
            });

            if (response.ok) {
                alert(`✅ Key generiert:\n${key}`);
                loadKeys();
            } else {
                const errorText = await response.text();
                alert('❌ Fehler beim Speichern: ' + errorText);
            }
        } catch (e) {
            alert('❌ Netzwerkfehler: ' + e.message);
        }
    }

    async function loadKeys() {
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/keys?order=created_at.desc&limit=50`, {
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                }
            });
            const keys = await response.json();
            if (keys.length === 0) {
                document.getElementById('keyList').innerHTML = '📭 Noch keine Keys generiert.';
                return;
            }
            document.getElementById('keyList').innerHTML = keys.map(k => {
                const status = k.used_by ? '❌ verwendet' : '✅ verfügbar';
                const statusClass = k.used_by ? 'used' : 'free';
                return `<div class="key-entry"><span class="${statusClass}">${status}</span> 🔑 ${k.key_value} – <strong>${k.duration}</strong> – gültig bis ${new Date(k.expires_at).toLocaleDateString()}</div>`;
            }).join('');
        } catch (e) {
            document.getElementById('keyList').innerHTML = '❌ Fehler beim Laden der Keys.';
        }
    }

    loadKeys();
</script>
</body>
</html>
