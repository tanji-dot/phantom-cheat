<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHANTOM</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
    body{background:#0a0a0f;color:#e0e0e0;display:flex;justify-content:center;align-items:center;min-height:100vh}
    .container{max-width:500px;width:100%;padding:2rem;background:#14141c;border-radius:2rem;border-left:4px solid #a855f7}
    h1{font-size:3rem;background:linear-gradient(135deg,#a855f7,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
    .card{background:#1a1a2e;padding:1.5rem;border-radius:1.5rem;margin:1.5rem 0}
    .btn{background:linear-gradient(135deg,#a855f7,#6366f1);border:none;color:#fff;padding:0.8rem;border-radius:2rem;font-weight:700;cursor:pointer;width:100%}
    .btn:hover{transform:scale(1.02)}
    input{width:100%;padding:0.8rem;background:#1e1e2a;border:1px solid #333;border-radius:1rem;color:#fff;margin:0.5rem 0}
    .hidden{display:none}
    a{color:#a855f7;cursor:pointer;text-decoration:underline}
    .msg{margin-top:1rem;padding:0.5rem;border-radius:0.5rem}
    .error{background:#2a0a0a;color:#ff8888;border:1px solid #ff4444}
    .success{background:#0a2a1a;color:#88ffbb;border:1px solid #44ff88}
    #downloadBtn{opacity:0.5;pointer-events:none;transition:0.3s}
    #downloadBtn.active{opacity:1;pointer-events:auto}
    .lifetime-badge{color:#fbbf24;font-weight:bold}
  </style>
</head>
<body>
<div class="container">
  <h1>👻 PHANTOM</h1>

  <div id="authSection" class="card">
    <div id="loginForm">
      <input type="text" id="loginEmail" placeholder="E-Mail oder Benutzername">
      <input type="password" id="loginPassword" placeholder="Passwort">
      <button class="btn" id="loginBtn">Anmelden</button>
      <p style="text-align:center;margin-top:0.5rem;"><a id="registerLink">Registrieren</a></p>
    </div>
    <div id="registerForm" class="hidden">
      <input type="text" id="regUsername" placeholder="Benutzername">
      <input type="email" id="regEmail" placeholder="E-Mail">
      <input type="password" id="regPassword" placeholder="Passwort (min. 6 Zeichen)">
      <button class="btn" id="registerBtn">Registrieren</button>
      <p style="text-align:center;margin-top:0.5rem;"><a id="loginLink">Zum Login</a></p>
    </div>
    <div id="msgBox" class="msg hidden"></div>
  </div>

  <div id="dashboard" class="hidden card">
    <h2 style="text-align:center;">✅ Eingeloggt</h2>
    <p style="text-align:center;font-size:1.2rem;">Willkommen, <span id="usernameDisplay">User</span>!</p>
    <hr style="border-color:#333;margin:1rem 0;">
    <p><strong>Key-Status:</strong> <span id="keyStatus">❌ Kein Key aktiviert</span></p>
    <p><strong>Gültig bis:</strong> <span id="keyExpiry">–</span></p>
    <div style="margin:1.5rem 0;">
      <h3>📥 Cheat herunterladen</h3>
      <a href="phantom.dll" download class="btn" id="downloadBtn">📥 PHANTOM.dll herunterladen</a>
      <p style="font-size:0.8rem;color:#666;text-align:center;">Nur verfügbar mit aktivem Key.</p>
    </div>
    <div>
      <h3>🔑 Key aktivieren</h3>
      <input type="text" id="activationKey" placeholder="PHANTOM-XXXX-XXXX-XXXX">
      <button class="btn" id="activateBtn">Key aktivieren</button>
    </div>
    <button id="logoutBtn" style="margin-top:1.5rem;background:#444;border:none;color:#fff;padding:0.6rem;border-radius:2rem;width:100%;cursor:pointer;">Ausloggen</button>
  </div>

  <div style="text-align:center;color:#555;font-size:0.8rem;margin-top:1rem;">
    <span>● Server: offline</span> · <span>● Cheat: bereit</span>
  </div>
</div>

<script>
  (function() {
    "use strict";

    // DOM
    var loginForm = document.getElementById('loginForm');
    var registerForm = document.getElementById('registerForm');
    var authSection = document.getElementById('authSection');
    var dashboard = document.getElementById('dashboard');
    var msgBox = document.getElementById('msgBox');

    var loginBtn = document.getElementById('loginBtn');
    var registerBtn = document.getElementById('registerBtn');
    var activateBtn = document.getElementById('activateBtn');
    var logoutBtn = document.getElementById('logoutBtn');
    var registerLink = document.getElementById('registerLink');
    var loginLink = document.getElementById('loginLink');

    function showMsg(text, type) {
      msgBox.className = 'msg ' + type;
      msgBox.textContent = text;
      msgBox.classList.remove('hidden');
    }

    function hideMsg() {
      msgBox.classList.add('hidden');
      msgBox.textContent = '';
    }

    // Navigation
    registerLink.onclick = function(e) {
      e.preventDefault();
      hideMsg();
      loginForm.style.display = 'none';
      registerForm.style.display = 'block';
    };

    loginLink.onclick = function(e) {
      e.preventDefault();
      hideMsg();
      loginForm.style.display = 'block';
      registerForm.style.display = 'none';
    };

    // Registrierung
    registerBtn.onclick = function() {
      hideMsg();
      var user = document.getElementById('regUsername').value.trim();
      var email = document.getElementById('regEmail').value.trim();
      var password = document.getElementById('regPassword').value;

      if (!user || !email || !password) {
        showMsg('Bitte alle Felder ausfüllen!', 'error');
        return;
      }
      if (password.length < 6) {
        showMsg('Passwort muss mindestens 6 Zeichen haben.', 'error');
        return;
      }

      var users = JSON.parse(localStorage.getItem('phantom_users') || '[]');
      if (users.find(function(u) { return u.username === user; })) {
        showMsg('Benutzername bereits vergeben!', 'error');
        return;
      }
      if (users.find(function(u) { return u.email === email; })) {
        showMsg('E-Mail bereits registriert!', 'error');
        return;
      }

      users.push({ username: user, email: email, password: password, key: null, keyExpiry: null, keyDuration: null });
      localStorage.setItem('phantom_users', JSON.stringify(users));

      showMsg('✅ Registrierung erfolgreich! Bitte logge dich ein.', 'success');
      setTimeout(function() {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
      }, 2000);
    };

    // Login
    loginBtn.onclick = function() {
      hideMsg();
      var email = document.getElementById('loginEmail').value.trim();
      var password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showMsg('Bitte E-Mail und Passwort eingeben!', 'error');
        return;
      }

      var users = JSON.parse(localStorage.getItem('phantom_users') || '[]');
      var user = null;
      for (var i = 0; i < users.length; i++) {
        if ((users[i].email === email || users[i].username === email) && users[i].password === password) {
          user = users[i];
          break;
        }
      }

      if (!user) {
        showMsg('Falsche E-Mail oder Passwort!', 'error');
        return;
      }

      localStorage.setItem('phantom_logged_in', JSON.stringify({ username: user.username, email: user.email }));

      authSection.style.display = 'none';
      dashboard.style.display = 'block';
      document.getElementById('usernameDisplay').textContent = user.username;
      loadUserData(user);
    };

    // User-Daten laden
    function loadUserData(user) {
      if (user.key && user.keyExpiry) {
        var expiry = new Date(user.keyExpiry);
        var now = new Date();
        
        // Prüfen ob Lifetime
        if (user.keyDuration === 'lifetime') {
          document.getElementById('keyStatus').innerHTML = '✅ Aktiviert <span class="lifetime-badge">(⚡ Lifetime)</span>';
          document.getElementById('keyExpiry').textContent = '∞ Unbegrenzt';
          document.getElementById('downloadBtn').classList.add('active');
          return;
        }
        
        if (expiry > now) {
          document.getElementById('keyStatus').innerHTML = '✅ Aktiviert';
          document.getElementById('keyExpiry').textContent = expiry.toLocaleDateString();
          document.getElementById('downloadBtn').classList.add('active');
          return;
        }
      }
      document.getElementById('keyStatus').innerHTML = '❌ Kein Key aktiviert';
      document.getElementById('keyExpiry').textContent = '–';
      document.getElementById('downloadBtn').classList.remove('active');
    }

    // Key aktivieren
    activateBtn.onclick = function() {
      var key = document.getElementById('activationKey').value.trim();
      var loggedIn = JSON.parse(localStorage.getItem('phantom_logged_in'));
      if (!loggedIn) {
        showMsg('Bitte zuerst einloggen.', 'error');
        return;
      }
      if (!key) {
        showMsg('Bitte einen Key eingeben.', 'error');
        return;
      }

      var validKeys = JSON.parse(localStorage.getItem('phantom_keys') || '[]');
      var keyData = null;
      for (var i = 0; i < validKeys.length; i++) {
        if (validKeys[i].key === key && !validKeys[i].used) {
          keyData = validKeys[i];
          break;
        }
      }

      if (!keyData) {
        showMsg('Ungültiger oder bereits verwendeter Key.', 'error');
        return;
      }

      // Key als verwendet markieren
      keyData.used = true;
      localStorage.setItem('phantom_keys', JSON.stringify(validKeys));

      var users = JSON.parse(localStorage.getItem('phantom_users') || '[]');
      var user = null;
      for (var j = 0; j < users.length; j++) {
        if (users[j].username === loggedIn.username) {
          user = users[j];
          break;
        }
      }
      
      if (user) {
        user.key = key;
        user.keyDuration = keyData.duration;
        
        // Ablaufdatum berechnen (außer bei Lifetime)
        if (keyData.duration === 'lifetime') {
          user.keyExpiry = null; // Unbegrenzt
        } else {
          var expiry = new Date();
          var days = parseInt(keyData.duration.replace('days', ''));
          if (isNaN(days)) days = 7; // Fallback
          expiry.setDate(expiry.getDate() + days);
          user.keyExpiry = expiry.toISOString();
        }
        
        localStorage.setItem('phantom_users', JSON.stringify(users));
        localStorage.setItem('phantom_logged_in', JSON.stringify({ username: user.username, email: user.email }));
        showMsg('✅ Key erfolgreich aktiviert!', 'success');
        loadUserData(user);
      }
    };

    // Logout
    logoutBtn.onclick = function() {
      localStorage.removeItem('phantom_logged_in');
      dashboard.style.display = 'none';
      authSection.style.display = 'block';
      loginForm.style.display = 'block';
      registerForm.style.display = 'none';
      hideMsg();
    };

    // Init – prüfen, ob User bereits eingeloggt ist
    (function init() {
      var loggedIn = JSON.parse(localStorage.getItem('phantom_logged_in'));
      if (loggedIn) {
        var users = JSON.parse(localStorage.getItem('phantom_users') || '[]');
        var user = null;
        for (var i = 0; i < users.length; i++) {
          if (users[i].username === loggedIn.username) {
            user = users[i];
            break;
          }
        }
        if (user) {
          authSection.style.display = 'none';
          dashboard.style.display = 'block';
          document.getElementById('usernameDisplay').textContent = user.username;
          loadUserData(user);
        } else {
          localStorage.removeItem('phantom_logged_in');
        }
      }
    })();

    // Key-Generator für die Konsole (Admin-Funktion)
    window.generateKey = function(duration) {
      if (!duration) duration = '7days';
      var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      var key = 'PHANTOM-';
      for (var i = 0; i < 3; i++) {
        for (var j = 0; j < 4; j++) {
          key += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        if (i < 2) key += '-';
      }
      var keys = JSON.parse(localStorage.getItem('phantom_keys') || '[]');
      keys.push({ key: key, used: false, duration: duration, created: new Date().toISOString() });
      localStorage.setItem('phantom_keys', JSON.stringify(keys));
      alert('✅ Key generiert: ' + key + ' (Dauer: ' + duration + ')');
      return key;
    };

    window.listKeys = function() {
      var keys = JSON.parse(localStorage.getItem('phantom_keys') || '[]');
      console.table(keys);
      return keys;
    };

  })();
</script>
</body>
</html>
