<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHANTOM</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
    body { background:#0a0a0f; color:#e0e0e0; display:flex; justify-content:center; align-items:center; min-height:100vh; }
    .container { max-width:500px; width:100%; padding:2rem; background:#14141c; border-radius:2rem; border-left:4px solid #a855f7; }
    h1 { font-size:3rem; background:linear-gradient(135deg,#a855f7,#6366f1); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-align:center; }
    .card { background:#1a1a2e; padding:1.5rem; border-radius:1.5rem; margin:1.5rem 0; }
    .btn { background:linear-gradient(135deg,#a855f7,#6366f1); border:none; color:#fff; padding:0.8rem; border-radius:2rem; font-weight:700; cursor:pointer; width:100%; }
    input { width:100%; padding:0.8rem; background:#1e1e2a; border:1px solid #333; border-radius:1rem; color:#fff; margin:0.5rem 0; }
    .hidden { display:none; }
    a { color:#a855f7; cursor:pointer; }
    .msg { margin-top:1rem; padding:0.5rem; border-radius:0.5rem; }
    .error { background:#2a0a0a; color:#ff8888; border:1px solid #ff4444; }
    .success { background:#0a2a1a; color:#88ffbb; border:1px solid #44ff88; }
  </style>
</head>
<body>
<div class="container">
  <h1>👻 PHANTOM</h1>

  <div id="authSection" class="card">
    <div id="loginForm">
      <input type="text" id="loginEmail" placeholder="E-Mail">
      <input type="password" id="loginPassword" placeholder="Passwort">
      <button class="btn" id="loginBtn">Anmelden</button>
      <p style="text-align:center;margin-top:0.5rem;"><a id="registerLink">Registrieren</a></p>
    </div>
    <div id="registerForm" class="hidden">
      <input type="text" id="regUsername" placeholder="Benutzername">
      <input type="email" id="regEmail" placeholder="E-Mail">
      <input type="password" id="regPassword" placeholder="Passwort (min. 6 Zeichen)">
      <button class="btn" id="registerBtn">Registrieren</button>
      <p style="text-align:center;margin-top:0.5rem;"><a id="loginLink">Zum Login</a></p>
    </div>
    <div id="msgBox" class="msg hidden"></div>
  </div>

  <div id="dashboard" class="hidden card">
    <h2 style="text-align:center;">✅ Eingeloggt</h2>
    <p style="text-align:center;font-size:1.2rem;">Willkommen, <span id="usernameDisplay">User</span>!</p>
    <hr style="border-color:#333;margin:1rem 0;">
    <p><strong>Key-Status:</strong> <span id="keyStatus">❌ Kein Key aktiviert</span></p>
    <p><strong>Gültig bis:</strong> <span id="keyExpiry">–</span></p>
    <div style="margin:1.5rem 0;">
      <h3>📥 Cheat herunterladen</h3>
      <a href="phantom.dll" download class="btn" id="downloadBtn" style="text-align:center;display:block;text-decoration:none;opacity:0.5;pointer-events:none;">📥 PHANTOM.dll herunterladen</a>
      <p style="font-size:0.8rem;color:#666;text-align:center;">Nur verfügbar mit aktivem Key.</p>
    </div>
    <div>
      <h3>🔑 Key aktivieren</h3>
      <input type="text" id="activationKey" placeholder="PHANTOM-XXXX-XXXX-XXXX|YYYY-MM-DD">
      <button class="btn" id="activateBtn">Key aktivieren</button>
    </div>
    <button id="logoutBtn" style="margin-top:1.5rem;background:#444;border:none;color:#fff;padding:0.6rem;border-radius:2rem;width:100%;cursor:pointer;">Ausloggen</button>
  </div>

  <div style="text-align:center;color:#555;font-size:0.8rem;margin-top:1rem;">
    <span>● Server: online</span> · <span>● Cheat: bereit</span>
  </div>
</div>

<script>
  // ============================================================
  // 🔥 POCKETBASE BACKEND (DEINE RENDER-URL!)
  // ============================================================
  const PB_URL = 'https://phantom-backend-917k.onrender.com';

  // ============================================================
  // DOM
  // ============================================================
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');
  const authSection = document.getElementById('authSection');
  const dashboard = document.getElementById('dashboard');
  const msgBox = document.getElementById('msgBox');

  const loginBtn = document.getElementById('loginBtn');
  const registerBtn = document.getElementById('registerBtn');
  const activateBtn = document.getElementById('activateBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const registerLink = document.getElementById('registerLink');
  const loginLink = document.getElementById('loginLink');

  function showMsg(text, type) {
    msgBox.className = 'msg ' + type;
    msgBox.textContent = text;
    msgBox.classList.remove('hidden');
  }
  function hideMsg() { msgBox.classList.add('hidden'); }

  registerLink.onclick = () => { hideMsg(); loginForm.classList.add('hidden'); registerForm.classList.remove('hidden'); };
  loginLink.onclick = () => { hideMsg(); loginForm.classList.remove('hidden'); registerForm.classList.add('hidden'); };

  // ============================================================
  // REGISTRIERUNG (POCKETBASE)
  // ============================================================
  registerBtn.onclick = async function() {
    hideMsg();
    const user = document.getElementById('regUsername').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    if (!user || !email || !password) { showMsg('Bitte alle Felder ausfüllen!', 'error'); return; }
    if (password.length < 6) { showMsg('Passwort muss min. 6 Zeichen haben.', 'error'); return; }

    showMsg('⏳ Registriere...', 'success');
    try {
      const res = await fetch(PB_URL + '/api/collections/users/records', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, email, password, passwordConfirm: password })
      });
      const data = await res.json();
      if (data.code) { showMsg(data.message, 'error'); return; }
      showMsg('✅ Registrierung erfolgreich! Bitte logge dich ein.', 'success');
      setTimeout(() => { loginForm.classList.remove('hidden'); registerForm.classList.add('hidden'); }, 2000);
    } catch (e) {
      showMsg('Netzwerkfehler: ' + e.message, 'error');
    }
  };

  // ============================================================
  // LOGIN (POCKETBASE)
  // ============================================================
  loginBtn.onclick = async function() {
    hideMsg();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) { showMsg('Bitte E-Mail und Passwort eingeben!', 'error'); return; }

    showMsg('⏳ Logge ein...', 'success');
    try {
      const res = await fetch(PB_URL + '/api/collections/users/auth-with-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identity: email, password })
      });
      const data = await res.json();
      if (data.code) { showMsg(data.message, 'error'); return; }

      localStorage.setItem('phantom_token', data.token);
      localStorage.setItem('phantom_user_id', data.record.id);

      authSection.classList.add('hidden');
      dashboard.classList.remove('hidden');
      document.getElementById('usernameDisplay').textContent = data.record.username || data.record.email;

      loadUserData();
    } catch (e) {
      showMsg('Netzwerkfehler: ' + e.message, 'error');
    }
  };

  // ============================================================
  // USER-DATEN LADEN (POCKETBASE)
  // ============================================================
  async function loadUserData() {
    const token = localStorage.getItem('phantom_token');
    const uid = localStorage.getItem('phantom_user_id');
    if (!token || !uid) return;
    try {
      const res = await fetch(PB_URL + '/api/collections/profiles/records/' + uid, {
        headers: { 'Authorization': token }
      });
      const p = await res.json();
      if (p.code) { console.error('Fehler beim Laden der User-Daten:', p.message); return; }
      if (p.key_activated) {
        document.getElementById('keyStatus').innerHTML = '✅ Aktiviert (' + p.key_activated + ')';
        document.getElementById('keyExpiry').textContent = new Date(p.key_expires_at).toLocaleDateString();
        document.getElementById('downloadBtn').style.opacity = '1';
        document.getElementById('downloadBtn').style.pointerEvents = 'auto';
      } else {
        document.getElementById('keyStatus').innerHTML = '❌ Kein Key aktiviert';
        document.getElementById('keyExpiry').textContent = '–';
        document.getElementById('downloadBtn').style.opacity = '0.5';
        document.getElementById('downloadBtn').style.pointerEvents = 'none';
      }
    } catch (e) { console.error('Fehler beim Laden der User-Daten:', e); }
  }

  // ============================================================
  // KEY AKTIVIEREN (POCKETBASE)
  // ============================================================
  activateBtn.onclick = async function() {
    const key = document.getElementById('activationKey').value.trim();
    const token = localStorage.getItem('phantom_token');
    const uid = localStorage.getItem('phantom_user_id');
    if (!token || !uid) { showMsg('Bitte zuerst einloggen.', 'error'); return; }
    if (!key) { showMsg('Bitte einen Key eingeben.', 'error'); return; }

    try {
      const res = await fetch(PB_URL + '/api/collections/keys/records?filter=(key_value="' + key + '")', {
        headers: { 'Authorization': token }
      });
      const data = await res.json();
      const k = data.items[0];
      if (!k) { showMsg('Ungültiger Key.', 'error'); return; }
      if (k.used_by) { showMsg('Dieser Key wurde bereits verwendet.', 'error'); return; }

      const now = new Date().toISOString();
      await fetch(PB_URL + '/api/collections/keys/records/' + k.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'Authorization': token },
        body: JSON.stringify({ used_by: uid, used_at: now })
      });

      await fetch(PB_URL + '/api/collections/profiles/records/' + uid, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'Authorization': token },
        body: JSON.stringify({ key_activated: k.duration, key_expires_at: k.expires_at })
      });

      showMsg('✅ Key erfolgreich aktiviert!', 'success');
      loadUserData();
    } catch (e) {
      showMsg('Fehler: ' + e.message, 'error');
    }
  };

  // ============================================================
  // LOGOUT
  // ============================================================
  logoutBtn.onclick = function() {
    localStorage.removeItem('phantom_token');
    localStorage.removeItem('phantom_user_id');
    dashboard.classList.add('hidden');
    authSection.classList.remove('hidden');
    loginForm.classList.remove('hidden');
    registerForm.classList.add('hidden');
    hideMsg();
  };
</script>
</body>
</html>
