<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>PHANTOM</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
    body { background:#0a0a0f; color:#e0e0e0; display:flex; justify-content:center; align-items:center; min-height:100vh; }
    .container { max-width:500px; width:100%; padding:2rem; background:#14141c; border-radius:2rem; border-left:4px solid #a855f7; box-shadow:0 0 40px rgba(100,0,255,0.15); }
    h1 { font-size:3rem; background:linear-gradient(135deg,#a855f7,#6366f1); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-align:center; }
    .card { background:#1a1a2e; padding:1.5rem; border-radius:1.5rem; margin:1.5rem 0; }
    .btn { background:linear-gradient(135deg,#a855f7,#6366f1); border:none; color:#fff; padding:0.8rem; border-radius:2rem; font-weight:700; cursor:pointer; width:100%; }
    input { width:100%; padding:0.8rem; background:#1e1e2a; border:1px solid #333; border-radius:1rem; color:#fff; margin:0.5rem 0; }
    .hidden { display:none; }
    a { color:#a855f7; cursor:pointer; }
    .msg { margin-top:1rem; padding:0.5rem; border-radius:0.5rem; }
    .error { background:#2a0a0a; color:#ff8888; border:1px solid #ff4444; }
    .success { background:#0a2a1a; color:#88ffbb; border:1px solid #44ff88; }
    #downloadBtn { opacity:0.5; pointer-events:none; }
    #downloadBtn.active { opacity:1; pointer-events:auto; }
  </style>
</head>
<body>
<div class="container">
  <h1>👻 PHANTOM</h1>

  <!-- LOGIN / REGISTRIERUNG -->
  <div id="authSection" class="card">
    <div id="loginForm">
      <input type="text" id="loginEmail" placeholder="E-Mail oder Benutzername">
      <input type="password" id="loginPassword" placeholder="Passwort">
      <button class="btn" id="loginBtn">Anmelden</button>
      <p style="margin-top:0.5rem;text-align:center;"><a id="registerLink">Registrieren</a></p>
    </div>
    <div id="registerForm" class="hidden">
      <input type="text" id="regUsername" placeholder="Benutzername">
      <input type="email" id="regEmail" placeholder="E-Mail">
      <input type="password" id="regPassword" placeholder="Passwort (min. 6 Zeichen)">
      <button class="btn" id="registerBtn">Registrieren</button>
      <p style="margin-top:0.5rem;text-align:center;"><a id="loginLink">Zum Login</a></p>
    </div>
    <div id="msgBox" class="msg hidden"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden card">
    <h2 style="text-align:center;">✅ Eingeloggt</h2>
    <p style="text-align:center;font-size:1.2rem;">Willkommen, <span id="usernameDisplay">User</span>!</p>
    <hr style="border-color:#333;margin:1rem 0;">
    <p><strong>Key-Status:</strong> <span id="keyStatus">❌ Kein Key aktiviert</span></p>
    <p><strong>Gültig bis:</strong> <span id="keyExpiry">–</span></p>
    <div style="margin:1.5rem 0;">
      <h3>📥 Cheat herunterladen</h3>
      <a href="phantom.dll" download class="btn" id="downloadBtn" style="text-align:center;display:block;text-decoration:none;">📥 PHANTOM.dll herunterladen</a>
      <p style="font-size:0.8rem;color:#666;text-align:center;">Nur verfügbar mit aktivem Key.</p>
    </div>
    <div>
      <h3>🔑 Key aktivieren</h3>
      <input type="text" id="activationKey" placeholder="PHANTOM-XXXX-XXXX-XXXX|YYYY-MM-DD">
      <button class="btn" id="activateBtn">Key aktivieren</button>
    </div>
    <button id="logoutBtn" style="margin-top:1.5rem;background:#444;border:none;color:#fff;padding:0.6rem;border-radius:2rem;width:100%;cursor:pointer;">Ausloggen</button>
  </div>

  <div id="statusBox" style="text-align:center;color:#555;font-size:0.8rem;margin-top:1rem;">
    <span>● Server: online</span> · <span>● Cheat: bereit</span>
  </div>
</div>

<script>
  // ============================================================
  // SUPABASE-KONFIG (DEINE DATEN!)
  // ============================================================
  const SUPABASE_URL = 'https://oikomaauhwwthmpufn.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_qPFjKF7p9gXu-SJQ4neo8w_wXyqlZw-';

  // ============================================================
  // DOM-REFERENZEN
  // ============================================================
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');
  const authSection = document.getElementById('authSection');
  const dashboard = document.getElementById('dashboard');
  const msgBox = document.getElementById('msgBox');

  const loginBtn = document.getElementById('loginBtn');
  const registerBtn = document.getElementById('registerBtn');
  const activateBtn = document.getElementById('activateBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const registerLink = document.getElementById('registerLink');
  const loginLink = document.getElementById('loginLink');

  const loginEmail = document.getElementById('loginEmail');
  const loginPassword = document.getElementById('loginPassword');
  const regUsername = document.getElementById('regUsername');
  const regEmail = document.getElementById('regEmail');
  const regPassword = document.getElementById('regPassword');
  const activationKey = document.getElementById('activationKey');
  const usernameDisplay = document.getElementById('usernameDisplay');
  const keyStatus = document.getElementById('keyStatus');
  const keyExpiry = document.getElementById('keyExpiry');
  const downloadBtn = document.getElementById('downloadBtn');

  // ============================================================
  // HELFER
  // ============================================================
  function showMsg(text, type) {
    msgBox.className = 'msg ' + type;
    msgBox.textContent = text;
    msgBox.classList.remove('hidden');
  }
  function hideMsg() { msgBox.classList.add('hidden'); }

  function showRegister() { hideMsg(); loginForm.classList.add('hidden'); registerForm.classList.remove('hidden'); }
  function showLoginForm() { hideMsg(); loginForm.classList.remove('hidden'); registerForm.classList.add('hidden'); }

  // ============================================================
  // EVENT LISTENER
  // ============================================================
  registerLink.onclick = showRegister;
  loginLink.onclick = showLoginForm;
  loginBtn.onclick = login;
  registerBtn.onclick = register;
  activateBtn.onclick = activateKey;
  logoutBtn.onclick = logout;

  // ============================================================
  // REGISTRIERUNG
  // ============================================================
  async function register() {
    hideMsg();
    const user = regUsername.value.trim();
    const email = regEmail.value.trim();
    const password = regPassword.value;

    if (!user || !email || !password) { showMsg('Bitte alle Felder ausfüllen!', 'error'); return; }
    if (password.length < 6) { showMsg('Passwort muss min. 6 Zeichen haben.', 'error'); return; }

    showMsg('⏳ Registriere...', 'success');

    try {
      const res = await fetch(SUPABASE_URL + '/auth/v1/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (data.error) { showMsg(data.error.message, 'error'); return; }

      const prof = await fetch(SUPABASE_URL + '/rest/v1/profiles', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          apikey: SUPABASE_ANON_KEY,
          Authorization: 'Bearer ' + data.access_token
        },
        body: JSON.stringify({ id: data.user.id, username: user })
      });
      if (prof.ok) {
        showMsg('✅ Registrierung erfolgreich! Bitte logge dich ein.', 'success');
        setTimeout(showLoginForm, 2000);
      } else {
        const err = await prof.text();
        showMsg('Profil-Fehler: ' + err, 'error');
      }
    } catch (e) {
      showMsg('Netzwerkfehler: ' + e.message, 'error');
    }
  }

  // ============================================================
  // LOGIN
  // ============================================================
  async function login() {
    hideMsg();
    const email = loginEmail.value.trim();
    const password = loginPassword.value;

    if (!email || !password) { showMsg('Bitte E-Mail und Passwort eingeben!', 'error'); return; }

    showMsg('⏳ Logge ein...', 'success');

    try {
      const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (data.error) { showMsg(data.error.message, 'error'); return; }

      // Speichern
      localStorage.setItem('phantom_access_token', data.access_token);
      localStorage.setItem('phantom_user_id', data.user.id);

      // Profil laden für den Namen
      let displayName = data.user.email;
      try {
        const prof = await fetch(SUPABASE_URL + '/rest/v1/profiles?id=eq.' + data.user.id, {
          headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + data.access_token }
        });
        const profiles = await prof.json();
        if (profiles && profiles[0] && profiles[0].username) displayName = profiles[0].username;
      } catch (e) { /* ignorieren */ }

      // DASHBOARD ANZEIGEN
      authSection.classList.add('hidden');
      dashboard.classList.remove('hidden');
      usernameDisplay.textContent = displayName;

      // Key-Status laden
      loadUserData();
    } catch (e) {
      showMsg('Netzwerkfehler: ' + e.message, 'error');
    }
  }

  // ============================================================
  // USER-DATEN LADEN
  // ============================================================
  async function loadUserData() {
    const token = localStorage.getItem('phantom_access_token');
    const uid = localStorage.getItem('phantom_user_id');
    if (!token || !uid) return;

    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/profiles?id=eq.' + uid, {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + token }
      });
      const profiles = await res.json();
      const p = profiles[0];
      if (p && p.key_activated) {
        keyStatus.innerHTML = '✅ Aktiviert (' + p.key_activated + ')';
        keyExpiry.textContent = new Date(p.key_expires_at).toLocaleDateString();
        downloadBtn.classList.add('active');
      } else {
        keyStatus.innerHTML = '❌ Kein Key aktiviert';
        keyExpiry.textContent = '–';
        downloadBtn.classList.remove('active');
      }
    } catch (e) {
      console.error('Fehler beim Laden der User-Daten:', e);
    }
  }

  // ============================================================
  // KEY AKTIVIEREN
  // ============================================================
  async function activateKey() {
    const key = activationKey.value.trim();
    const token = localStorage.getItem('phantom_access_token');
    const uid = localStorage.getItem('phantom_user_id');
    if (!token || !uid) { showMsg('Bitte zuerst einloggen.', 'error'); return; }
    if (!key) { showMsg('Bitte einen Key eingeben.', 'error'); return; }

    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/keys?key_value=eq.' + encodeURIComponent(key), {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + token }
      });
      const keys = await res.json();
      const k = keys[0];
      if (!k) { showMsg('Ungültiger Key.', 'error'); return; }
      if (k.used_by) { showMsg('Dieser Key wurde bereits verwendet.', 'error'); return; }

      const now = new Date().toISOString();
      await fetch(SUPABASE_URL + '/rest/v1/keys?id=eq.' + k.id, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          apikey: SUPABASE_ANON_KEY,
          Authorization: 'Bearer ' + token
        },
        body: JSON.stringify({ used_by: uid, used_at: now })
      });

      await fetch(SUPABASE_URL + '/rest/v1/profiles?id=eq.' + uid, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          apikey: SUPABASE_ANON_KEY,
          Authorization: 'Bearer ' + token
        },
        body: JSON.stringify({ key_activated: k.duration, key_expires_at: k.expires_at })
      });

      showMsg('✅ Key erfolgreich aktiviert!', 'success');
      loadUserData();
    } catch (e) {
      showMsg('Fehler: ' + e.message, 'error');
    }
  }

  // ============================================================
  // LOGOUT
  // ============================================================
  function logout() {
    localStorage.removeItem('phantom_access_token');
    localStorage.removeItem('phantom_user_id');
    dashboard.classList.add('hidden');
    authSection.classList.remove('hidden');
    showLoginForm();
    hideMsg();
  }

  // ============================================================
  // AUTOMATISCHER LOGIN-CHECK (bleibt eingeloggt)
  // ============================================================
  (function checkAutoLogin() {
    const token = localStorage.getItem('phantom_access_token');
    const uid = localStorage.getItem('phantom_user_id');
    if (token && uid) {
      // Versuche, den User automatisch einzuloggen (ohne Passwort)
      // Dafür laden wir einfach die User-Daten – wenn das klappt, zeigen wir Dashboard
      fetch(SUPABASE_URL + '/rest/v1/profiles?id=eq.' + uid, {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + token }
      })
        .then(res => {
          if (res.ok) {
            authSection.classList.add('hidden');
            dashboard.classList.remove('hidden');
            usernameDisplay.textContent = 'User';
            loadUserData();
          } else {
            // Token ungültig -> ausloggen
            logout();
          }
        })
        .catch(() => logout());
    }
  })();
</script>
</body>
</html>
