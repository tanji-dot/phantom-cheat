<!DOCTYPE html>
<html>
<head>
    <title>PHANTOM</title>
    <style>
        body { background: #0a0a0f; color: white; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: #1a1a2e; padding: 2rem; border-radius: 1rem; border-left: 4px solid #a855f7; max-width: 400px; width: 100%; }
        input, button { display: block; width: 100%; margin: 0.5rem 0; padding: 0.8rem; border-radius: 0.5rem; border: none; }
        button { background: #a855f7; color: white; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }
        a { color: #a855f7; cursor: pointer; }
    </style>
</head>
<body>
<div class="box">
    <h1>👻 PHANTOM</h1>
    <div id="loginArea">
        <input type="text" id="user" placeholder="Benutzername" />
        <input type="password" id="pass" placeholder="Passwort" />
        <button onclick="doLogin()">Anmelden</button>
        <p><a onclick="showReg()">Registrieren</a></p>
        <div id="msg" style="color:#ff8888;margin-top:1rem;"></div>
    </div>
    <div id="registerArea" class="hidden">
        <input type="text" id="regUser" placeholder="Benutzername" />
        <input type="email" id="regMail" placeholder="E-Mail" />
        <input type="password" id="regPass" placeholder="Passwort" />
        <button onclick="doRegister()">Registrieren</button>
        <p><a onclick="showLogin()">Zurück</a></p>
        <div id="regMsg" style="color:#ff8888;margin-top:1rem;"></div>
    </div>
    <div id="dashboard" class="hidden">
        <h2>✅ Eingeloggt!</h2>
        <p>Willkommen, <span id="nameDisplay"></span>!</p>
        <button onclick="doLogout()">Ausloggen</button>
    </div>
</div>
<script>
    // ============================================================
    // SUPABASE-KONFIG
    // ============================================================
    const SUPABASE_URL = 'https://oikomaauhwwthmpufn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qPFjKF7p9gXu-SJQ4neo8w_wXyqL...';

    // ============================================================
    // UI-FUNKTIONEN
    // ============================================================
    function showReg() {
        document.getElementById('loginArea').classList.add('hidden');
        document.getElementById('registerArea').classList.remove('hidden');
        document.getElementById('msg').textContent = '';
    }
    function showLogin() {
        document.getElementById('loginArea').classList.remove('hidden');
        document.getElementById('registerArea').classList.add('hidden');
        document.getElementById('msg').textContent = '';
    }

    // ============================================================
    // REGISTRIERUNG MIT SUPABASE
    // ============================================================
    async function doRegister() {
        const user = document.getElementById('regUser').value;
        const mail = document.getElementById('regMail').value;
        const pass = document.getElementById('regPass').value;

        // 🔥 WICHTIG: Das Element für Fehlermeldungen im Register-Bereich
        const regMsg = document.getElementById('regMsg');

        if (!user || !mail || !pass) {
            regMsg.textContent = '❌ Bitte alle Felder ausfüllen!';
            return;
        }

        regMsg.textContent = '⏳ Registriere...';

        try {
            // 1. Account bei Supabase erstellen
            const response = await fetch(SUPABASE_URL + '/auth/v1/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'apikey': SUPABASE_ANON_KEY
                },
                body: JSON.stringify({ email: mail, password: pass })
            });

            const data = await response.json();
            console.log('📦 Supabase Antwort:', data);

            if (data.error) {
                regMsg.textContent = '❌ ' + data.error.message;
                return;
            }

            // 2. Profil in der Datenbank anlegen
            const profileResponse = await fetch(SUPABASE_URL + '/rest/v1/profiles', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': 'Bearer ' + data.access_token
                },
                body: JSON.stringify({ id: data.user.id, username: user })
            });

            if (profileResponse.ok) {
                regMsg.textContent = '✅ Registrierung erfolgreich! Bitte logge dich ein.';
                // Nach erfolgreicher Registrierung zum Login wechseln
                setTimeout(() => {
                    showLogin();
                }, 2000);
            } else {
                const err = await profileResponse.text();
                regMsg.textContent = '❌ Profil-Fehler: ' + err;
            }
        } catch (e) {
            regMsg.textContent = '❌ Netzwerkfehler: ' + e.message;
            console.error(e);
        }
    }

    // ============================================================
    // LOGIN (NUR LOKAL – NOCH KEIN SUPABASE)
    // ============================================================
    function doLogin() {
        const user = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;
        const savedUser = localStorage.getItem('test_user');
        const savedPass = localStorage.getItem('test_pass');
        const msg = document.getElementById('msg');

        if (!user || !pass) {
            msg.textContent = '❌ Bitte Benutzername und Passwort eingeben!';
            return;
        }
        if (user === savedUser && pass === savedPass) {
            document.getElementById('loginArea').classList.add('hidden');
            document.getElementById('registerArea').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('nameDisplay').textContent = user;
            msg.textContent = '';
        } else {
            msg.textContent = '❌ Falscher Benutzername oder Passwort!';
        }
    }

    function doLogout() {
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('loginArea').classList.remove('hidden');
        document.getElementById('msg').textContent = '';
    }
</script>
</body>
</html>
